# ──────────────────────────────────────────────────────────────
#  Lean OmniParse — Docker Compose (Development)
#
#  Services:
#    api     — FastAPI (uvicorn) on port 8000
#    worker  — Celery worker consuming from Redis
#    redis   — Message broker + result backend
#
#  MongoDB is hosted locally in the docker network.
# ──────────────────────────────────────────────────────────────

services:
  # ── MongoDB Database ──
  mongo:
    image: mongo:7.0
    container_name: omniparse-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
  # ── FastAPI Gateway ──
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniparse-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app           # Hot-reload during development
      - upload_data:/app/uploads  # Persistent upload storage
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Background Worker ──
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniparse-worker
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app           # Hot-reload during development
      - upload_data:/app/uploads  # Shared access to uploaded PDFs
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # ── Redis Message Broker ──
  redis:
    image: redis:7-alpine
    container_name: omniparse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes  # AOF persistence
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Observability Stack ──
  prometheus:
    image: prom/prometheus:latest
    container_name: omniparse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: omniparse-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: omniparse-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: omniparse-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki

volumes:
  upload_data:
    driver: local
  redis_data:
    driver: local
  mongo_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
