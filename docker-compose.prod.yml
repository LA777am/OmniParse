version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniparse-api-prod
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/app/uploads
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 400M

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniparse-worker-prod
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - upload_data:/app/uploads
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 400M

  mongo:
    image: mongo:latest
    container_name: omniparse-mongo-prod
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 250M

  redis:
    image: redis:alpine
    container_name: omniparse-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  upload_data:
    driver: local
  mongo_data:
    driver: local
  redis_data:
    driver: local
